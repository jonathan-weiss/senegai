spring.application.name=server
server.port=8081

# Repository implementation to use: "in-memory" (default) or "postgres".
# With "postgres" the PostgresSql*Repository beans take precedence over the InMemory*Repository ones.
senegai.persistence.type=in-memory

spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=password
