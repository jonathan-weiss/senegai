<div class="entitas-relata-container">
    <div class="entitas-relata-header">
        <h2>{{'entitasRelata.board.title' | transloco }}</h2>
    </div>

    <mat-accordion class="entitas-relata-accordion" multi>
        <!-- Results Panel -->
        <mat-expansion-panel expanded>
            <mat-expansion-panel-header>
                <mat-panel-title>
                    <mat-icon>list</mat-icon>
                    <ng-container>EntitasRelata List</ng-container>
                </mat-panel-title>
            </mat-expansion-panel-header>
            <app-entitas-relata-result
                    (selectEntitasRelata)="onEntitasRelataSelect($event)"
                    (deleteEntitasRelata)="onDeleteEntitasRelata($event)"
                    (createEntitasRelata)="onCreateEntitasRelata()"
                    [refreshKey]="refreshKey">
            </app-entitas-relata-result>
        </mat-expansion-panel>

        <!-- Edit Form Panel -->
        <mat-expansion-panel
                [expanded]="!!selectedEntitasRelata || creating"
                [disabled]="!selectedEntitasRelata && !creating">
            <mat-expansion-panel-header>
                <mat-panel-title>
                    <mat-icon>edit</mat-icon>
                    <ng-container>{{ creating ? 'New EntitasRelata' : 'Edit EntitasRelata' }}</ng-container>
                </mat-panel-title>
                @if (selectedEntitasRelata) {
                    <mat-panel-description>
                        {{ selectedEntitasRelata.clavisPrimaria }}
                    </mat-panel-description>
                }
            </mat-expansion-panel-header>

            @if (selectedEntitasRelata || creating) {
                <app-entitas-relata-form
                        [membrumRelatum]="selectedEntitasRelata"
                        (save)="onSave($event)"
                        (cancel)="onCancel()">
                </app-entitas-relata-form>
            }
        </mat-expansion-panel>
    </mat-accordion>
</div>
