<div class="table-container">
    <div class="action-bar">
        <button mat-button color="primary" (click)="onAdd()" type="button" [disabled]="membrumRelatumFormArray.disabled">
            <mat-icon>add</mat-icon> Add MembrumRelatum...
        </button>

    </div>
    <table mat-table [dataSource]="dataSource">

        <!-- ClavisPrimaria Column -->
        <ng-container matColumnDef="clavisPrimaria">
            <th mat-header-cell *matHeaderCellDef>ClavisPrimaria</th>
            <td mat-cell *matCellDef="let tableRow" (click)="onSelect(tableRow.formGroup)">
                {{ tableRow.clavisPrimaria }}
            </td>
        </ng-container>

        <!-- DescriptioExDistanti Column -->
        <ng-container matColumnDef="descriptioExDistanti">
            <th mat-header-cell *matHeaderCellDef>DescriptioExDistanti</th>
            <td mat-cell *matCellDef="let tableRow" (click)="onSelect(tableRow.formGroup)">
                {{ tableRow.descriptioExDistanti }}
            </td>
        </ng-container>


        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let tableRow">
                <button mat-icon-button color="primary" (click)="onEdit(tableRow.formGroup)" type="button" [disabled]="membrumRelatumFormArray.disabled">
                    <mat-icon>edit</mat-icon>
                </button>
                <button mat-icon-button color="warn" (click)="onDelete(tableRow.formGroup)" type="button" [disabled]="membrumRelatumFormArray.disabled">
                    <mat-icon>delete</mat-icon>
                </button>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;" [class.selectedRow] = "isSelected(row)"></tr>
    </table>
</div>
