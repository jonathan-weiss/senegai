<div class="edit-form-container">
    <mat-card>
        <mat-card-header>
            <mat-card-title>{{ membrumRelatum ? 'Edit EntitasRelata' : 'New EntitasRelata' }}</mat-card-title>
        </mat-card-header>

        <mat-card-content>
            <form [formGroup]="membrumRelatumForm" (ngSubmit)="onSubmit()">
                <app-entitas-relata-membrum-relatum-form-part [membrumRelatumForm]="membrumRelatumForm" />

                <div class="form-actions">
                    <button mat-button type="button" (click)="onCancel()">
                        Cancel
                    </button>
                    <button mat-raised-button color="primary" type="submit" [disabled]="!membrumRelatumForm.valid">
                        Save
                    </button>
                </div>
            </form>
        </mat-card-content>
    </mat-card>
</div>
