<div class="entitas-relata-table-container">
    <div class="entitas-relata-result-actions">
        <button mat-raised-button color="primary" (click)="onCreate()">
            <mat-icon>add</mat-icon>
            <ng-container>New EntitasRelata</ng-container>
        </button>
    </div>
    <table mat-table [dataSource]="dataSource">

        <!-- ClavisPrimaria Column -->
        <ng-container matColumnDef="clavisPrimaria">
            <th mat-header-cell *matHeaderCellDef>ClavisPrimaria</th>
            <td mat-cell *matCellDef="let entitasRelata">{{ entitasRelata.clavisPrimaria }}</td>
        </ng-container>
        <!-- DescriptioExDistanti Column -->
        <ng-container matColumnDef="descriptioExDistanti">
            <th mat-header-cell *matHeaderCellDef>DescriptioExDistanti</th>
            <td mat-cell *matCellDef="let entitasRelata">{{ entitasRelata.descriptioExDistanti }}</td>
        </ng-container>

        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let entitasRelata">
                <button mat-icon-button color="primary" (click)="onEdit(entitasRelata)">
                    <mat-icon>edit</mat-icon>
                </button>
                <button mat-icon-button color="warn" (click)="onDelete(entitasRelata)">
                    <mat-icon>delete</mat-icon>
                </button>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
</div>
