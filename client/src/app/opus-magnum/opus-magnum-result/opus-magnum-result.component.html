<div class="opus-magnum-table-container">
    <div class="opus-magnum-result-actions">
        <button mat-raised-button color="primary" (click)="onCreate()">
            <mat-icon>add</mat-icon>
            <ng-container>New OpusMagnum</ng-container>
        </button>
    </div>
    <div class="opus-magnum-table-scroll">
        <table mat-table [dataSource]="dataSource">
            <!-- @tt{{{   @ignore-text  }}}@ -->
            <!-- IndexUnicus Column -->
            <ng-container matColumnDef="indexUnicus">
                <th mat-header-cell *matHeaderCellDef><span class="table-cell-content">IndexUnicus</span></th>
                <td mat-cell *matCellDef="let opusMagnum">
                    <span class="table-cell-content" [title]="opusMagnum.indexUnicus">{{ opusMagnum.indexUnicus }}</span>
                </td>
            </ng-container>
            <!-- @tt{{{   @end-ignore-text  }}}@ -->

            <!-- @tt{{{
                @foreach [ iteratorExpression="model.searchResultAttributes" loopVariable="attribute" ]

                    @replace-value-by-expression
                    [ searchValue="campusTextusObligatorius" replaceByExpression="attribute.attributeName.camelCase" ]
                    [ searchValue="Campus Textus Obligatorius" replaceByExpression="attribute.attributeName.pascalCase" ]
                    [ searchValue="string" replaceByExpression="attribute.typescriptAttributeType" ]

            }}}@  -->
            <!-- Campus Textus Obligatorius Column -->
            <ng-container matColumnDef="campusTextusObligatorius">
                <th mat-header-cell *matHeaderCellDef><span class="table-cell-content">Campus Textus Obligatorius</span></th>
                <td mat-cell *matCellDef="let opusMagnum">
                    <span class="table-cell-content" [title]="opusMagnum.campusTextusObligatorius">{{ opusMagnum.campusTextusObligatorius }}</span>
                </td>
            </ng-container>
            <!-- @tt{{{  @end-foreach  }}}@ -->

            <!-- Actions Column -->
            <ng-container matColumnDef="actions" stickyEnd>
                <th mat-header-cell *matHeaderCellDef>Actions</th>
                <td mat-cell *matCellDef="let opusMagnum">
                    <button mat-icon-button color="primary" (click)="onEdit(opusMagnum)">
                        <mat-icon>edit</mat-icon>
                    </button>
                    <button mat-icon-button color="warn" (click)="onDelete(opusMagnum)">
                        <mat-icon>delete</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
    </div>
</div>
